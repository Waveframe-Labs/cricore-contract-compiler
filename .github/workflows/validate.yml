name: Validate compiler

on:
  pull_request:
    branches: [main, feat/issue-5-action-policy]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: compiler-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.9', '3.14']
    env:
      EXPECTED_COMMIT: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned validation dependencies
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - name: Validate source and clean installed package at the exact commit
        run: python scripts/validate.py --output .cache/ci-validation
      - name: Retain provenance, tests, compiled outputs, and distributions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-${{ matrix.os }}-python-${{ matrix.python }}-${{ env.EXPECTED_COMMIT }}
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .cache/ci-validation/provenance.json
            .cache/ci-validation/source-dependencies.txt
            .cache/ci-validation/source-tests.xml
            .cache/ci-validation/source-contracts/
            .cache/ci-validation/package/dist/
            .cache/ci-validation/package/SHA256SUMS
            .cache/ci-validation/package/package.json
            .cache/ci-validation/package/installed-tests.xml
            .cache/ci-validation/package/installed-dependencies.txt
            .cache/ci-validation/package/contracts/
            .cache/ci-validation/package/cli-rejections.json
